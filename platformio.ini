; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
; Pinned: 6.10.0 ships framework-arduinoespressif32 3.20017.x (Arduino core 2.0.17),
; which is the version main.cpp requires. Newer platforms move to core 3.x and break the build.
platform = espressif32@6.10.0
board = nodemcu-32s
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    xreef/PCF8574 library@^2.3.7

; Embed web/index.html into the firmware as a flash blob; symbols
; _binary_web_index_html_start / _end are referenced from main.cpp.
board_build.embed_txtfiles =
    web/index.html

; OTA upload over Ethernet. Usage:
;   pio run -e nodemcu-32s-ota -t upload
; Flash the device once over USB (env: nodemcu-32s) so it runs the OTA-enabled
; firmware, then read its IP from the serial log and set upload_port below.
[env:nodemcu-32s-ota]
extends = env:nodemcu-32s
upload_protocol = espota
upload_port = 192.168.1.200       ; replace with the device's IP (or retention-tank.local if mDNS works on your LAN)
; upload_flags = --auth=change-me ; uncomment if you set ArduinoOTA.setPassword() in main.cpp
