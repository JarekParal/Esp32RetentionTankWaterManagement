; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
; pioarduino fork is the actively maintained Arduino-ESP32 platform; this pin
; ships Arduino core 3.3.8 + ESP-IDF 5.5.4. Bump deliberately and re-verify
; ETH.begin() / attachInterrupt / Preferences usage against the new core.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = nodemcu-32s
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    xreef/PCF8574 library@^2.3.7
    olikraus/U8g2@^2.35.30
    emelianov/modbus-esp8266@^4.1.0

; Embed web/index.html and web/config.json into the firmware as flash blobs.
; Symbols _binary_<path>_start / _end (slashes/dots become underscores) are
; referenced from main.cpp's HTTP handlers.
board_build.embed_txtfiles =
    web/index.html
    web/config.json

; Injects GIT_HASH and BUILD_DATE preprocessor defines so util_version_string()
; can report them. Runs on every build; see the script for details.
extra_scripts = pre:scripts/inject_build_info.py

; OTA upload over Ethernet. Usage:
;   pio run -e nodemcu-32s-ota -t upload
; Flash the device once over USB (env: nodemcu-32s) so it runs the OTA-enabled
; firmware, then read its IP from the serial log and set upload_port below.
[env:nodemcu-32s-ota]
extends = env:nodemcu-32s
upload_protocol = espota
upload_port = 192.168.1.200       ; replace with the device's IP (or retention-tank.local if mDNS works on your LAN)
; upload_flags = --auth=change-me ; uncomment if you set ArduinoOTA.setPassword() in main.cpp
