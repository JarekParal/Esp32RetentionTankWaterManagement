; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
; Pinned: 6.10.0 ships framework-arduinoespressif32 3.20017.x (Arduino core 2.0.17),
; which is the version main.cpp requires. Newer platforms move to core 3.x and break the build.
platform = espressif32@6.10.0
board = nodemcu-32s
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    xreef/PCF8574 library@^2.3.7
