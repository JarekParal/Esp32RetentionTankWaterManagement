<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retention Tank</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a1f26;
      --panel2: #222831;
      --border: #2a3441;
      --text: #e6e9ee;
      --muted: #8a96a8;
      --accent: #3b82f6;
      --ok: #10b981;
      --off: #475569;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9;
        --panel: #fff;
        --panel2: #f1f3f6;
        --border: #e4e7eb;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --ok: #16a34a;
        --off: #94a3b8;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }
    header.top h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .version {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace;
    }

    .metrics {
      display: flex;
      gap: 18px;
      font-size: 13px;
    }
    .metric {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .metric label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .metric strong {
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 900px) {
      main { grid-template-columns: 1fr 1fr; }
    }

    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    section > h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .valve-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .valve {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: border-color .15s, background .15s, opacity .15s;
    }
    .valve:hover { border-color: var(--accent); }
    .valve.open {
      background: color-mix(in srgb, var(--ok) 18%, var(--panel2));
      border-color: var(--ok);
    }
    .valve .name {
      font-weight: 600;
      font-size: 13px;
    }
    .valve .note {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }
    .valve .status {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .valve.open .status { color: var(--ok); }
    .valve .toggle {
      align-self: flex-end;
      width: 36px;
      height: 20px;
      background: var(--off);
      border-radius: 11px;
      position: relative;
      flex-shrink: 0;
      transition: background .15s;
    }
    .valve .toggle::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform .15s;
    }
    .valve.open .toggle { background: var(--ok); }
    .valve.open .toggle::after { transform: translateX(16px); }
    .valve.pending {
      opacity: .55;
      pointer-events: none;
    }

    .term-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .term-head h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .term-head button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .term-head button:hover {
      color: var(--text);
      border-color: var(--accent);
    }
    .term-head button.danger:hover {
      color: #fff;
      border-color: #ef4444;
      background: #ef4444;
    }

    #terminal {
      margin: 0;
      background: #000;
      color: #cfe;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      height: 340px;
      overflow-y: auto;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #terminal:empty::before {
      content: "(no log lines yet)";
      color: #556;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--off);
      margin-left: 6px;
      vertical-align: middle;
      transition: background .2s;
    }
    .dot.live {
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
    }

    section.history { grid-column: 1 / -1; }
    .history-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 700px) {
      .history-grid { grid-template-columns: 1fr 1fr; }
    }
    .chart-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .chart-title .range {
      font-variant-numeric: tabular-nums;
      text-transform: none;
      letter-spacing: 0;
    }
    .chart-title button {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      font: 11px/1.4 system-ui, sans-serif;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
    }
    .chart-title button:hover { background: var(--panel); }
    .chart-title button.danger { color: #fff; background: #b91c1c; border-color: #991b1b; }
    .chart-title button.danger:hover { background: #991b1b; }
    .chart {
      display: block;
      width: 100%;
      height: 110px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .chart-range  { stroke: var(--muted); stroke-width: 0.6; opacity: 0.45; }
    .chart-line   { fill: none; stroke: var(--accent); stroke-width: 1; }
    .chart-dot    { fill: var(--accent); }
    .chart-empty  { fill: var(--muted); font-size: 5px; }

    section.inputs { grid-column: 1 / -1; }
    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .input-card {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-card.active {
      background: color-mix(in srgb, var(--ok) 18%, var(--panel2));
      border-color: var(--ok);
    }
    .input-card .name  { font-weight: 600; font-size: 13px; }
    .input-card .note  { font-size: 11px; color: var(--muted); line-height: 1.3; }
    .input-card .status {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .input-card.active .status { color: var(--ok); }
    .input-indicator {
      align-self: flex-end;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--off);
      transition: background .2s, box-shadow .2s;
    }
    .input-card.active .input-indicator {
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
    }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1><span id="title">Retention Tank</span><span id="conn" class="dot" title="connection"></span></h1>
      <small id="version" class="version">&mdash;</small>
    </div>
    <div class="metrics">
      <div class="metric">
        <label id="level-label">Tank distance</label>
        <strong id="level">&mdash;</strong>
      </div>
      <div class="metric">
        <label>Uptime</label>
        <strong id="uptime">&mdash;</strong>
      </div>
    </div>
  </header>

  <main>
    <section class="history">
      <h2>Tank Distance</h2>
      <div class="history-grid">
        <div>
          <div class="chart-title">
            <span id="window-24h">Last 24 hours</span>
            <span class="range" id="range-24h">&mdash;</span>
            <button id="clearShort" class="danger" type="button">Clear 24h</button>
          </div>
          <svg id="chart-24h" class="chart" viewBox="0 0 240 80" preserveAspectRatio="none"></svg>
        </div>
        <div>
          <div class="chart-title">
            <span id="window-30d">Last 30 days</span>
            <span class="range" id="range-30d">&mdash;</span>
            <button id="clearLong" class="danger" type="button">Clear 30d</button>
          </div>
          <svg id="chart-30d" class="chart" viewBox="0 0 240 80" preserveAspectRatio="none"></svg>
        </div>
      </div>
    </section>

    <section>
      <div class="term-head">
        <h2>Solenoid Valves</h2>
        <button id="closeAll" class="danger">Close all</button>
      </div>
      <div id="valves" class="valve-grid"></div>
    </section>

    <section>
      <div class="term-head">
        <h2>Device Log</h2>
        <button id="clearLog">Clear</button>
      </div>
      <pre id="terminal"></pre>
    </section>

    <section class="inputs">
      <h2>Digital Inputs</h2>
      <div id="inputs" class="input-grid"></div>
    </section>
  </main>

  <script>
    (() => {
      const VALVE_COUNT = 8;
      const INPUT_COUNT = 8;
      const POLL_INTERVAL_MS = 750;
      const HISTORY_POLL_MS = 30000;
      const SVG_NS = 'http://www.w3.org/2000/svg';

      let lastSeq = 0;
      let relays = 0;
      let inputs = 0;
      let paused = false;
      const pending = new Set();
      let valveLabels = Array.from({ length: VALVE_COUNT }, (_, i) => ({
        name: `Valve ${i + 1}`, note: '',
      }));
      let inputLabels = Array.from({ length: INPUT_COUNT }, (_, i) => ({
        name: `Input ${i + 1}`, note: '',
      }));
      let tankCal = null;  // { empty_cm, full_cm } after loadConfig if set

      const $valves = document.getElementById('valves');
      const $terminal = document.getElementById('terminal');
      const $level = document.getElementById('level');
      const $levelLabel = document.getElementById('level-label');
      const $uptime = document.getElementById('uptime');
      const $conn = document.getElementById('conn');
      const $version = document.getElementById('version');
      const $title = document.getElementById('title');
      const $inputs   = document.getElementById('inputs');
      const $chart24h = document.getElementById('chart-24h');
      const $chart30d = document.getElementById('chart-30d');
      const $range24h = document.getElementById('range-24h');
      const $range30d = document.getElementById('range-30d');
      const $window24h = document.getElementById('window-24h');
      const $window30d = document.getElementById('window-30d');

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      async function loadConfig() {
        try {
          const res = await fetch('/config.json');
          if (!res.ok) return;
          const cfg = await res.json();
          if (typeof cfg.title === 'string' && cfg.title) {
            document.title = cfg.title;
            $title.textContent = cfg.title;
          }
          if (Array.isArray(cfg.valves)) {
            for (let i = 0; i < VALVE_COUNT; i++) {
              const v = cfg.valves[i];
              if (!v) continue;
              if (typeof v.name === 'string' && v.name) valveLabels[i].name = v.name;
              if (typeof v.note === 'string')          valveLabels[i].note = v.note;
            }
          }
          if (Array.isArray(cfg.inputs)) {
            for (let i = 0; i < INPUT_COUNT; i++) {
              const v = cfg.inputs[i];
              if (!v) continue;
              if (typeof v.name === 'string' && v.name) inputLabels[i].name = v.name;
              if (typeof v.note === 'string')           inputLabels[i].note = v.note;
            }
          }
          if (cfg.tank && Number.isFinite(cfg.tank.empty_distance_cm)
                       && Number.isFinite(cfg.tank.full_distance_cm)
                       && cfg.tank.empty_distance_cm > cfg.tank.full_distance_cm) {
            tankCal = { empty_cm: cfg.tank.empty_distance_cm, full_cm: cfg.tank.full_distance_cm };
            $levelLabel.textContent = 'Tank level';
          }
        } catch (_e) { /* fall back to defaults */ }
      }

      function distanceToFullness(cm) {
        if (!tankCal) return null;
        const range = tankCal.empty_cm - tankCal.full_cm;
        const pct = (tankCal.empty_cm - cm) / range * 100;
        return Math.max(0, Math.min(100, pct));
      }

      function formatLevel(cm) {
        if (!Number.isFinite(cm)) return '—';
        const pct = distanceToFullness(cm);
        return pct !== null ? `${pct.toFixed(0)} %` : `${cm.toFixed(1)} cm`;
      }

      function describeWindow(periodSec, count) {
        const total = periodSec * count;
        if (total >= 86400 * 1.5) return `Last ${Math.round(total / 86400)} days`;
        if (total >= 3600)        return `Last ${Math.round(total / 3600)} hours`;
        return `Last ${Math.round(total / 60)} min`;
      }

      function formatUptime(ms) {
        const totalSec = Math.floor(ms / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return (h ? `${h}h ` : '') + ((h || m) ? `${m}m ` : '') + `${s}s`;
      }

      function render() {
        $valves.innerHTML = '';
        for (let i = 0; i < VALVE_COUNT; i++) {
          const open = !!(relays & (1 << i));
          const { name, note } = valveLabels[i];
          const el = document.createElement('div');
          el.className = 'valve'
            + (open ? ' open' : '')
            + (pending.has(i + 1) ? ' pending' : '');
          el.dataset.n = i + 1;
          el.innerHTML = `
            <div class="name">${escapeHtml(name)}</div>
            ${note ? `<div class="note">${escapeHtml(note)}</div>` : ''}
            <div class="status">${open ? 'Open' : 'Closed'}</div>
            <div class="toggle"></div>
          `;
          el.addEventListener('click', () => toggleValve(i + 1, !open));
          $valves.appendChild(el);
        }
      }

      function renderInputs() {
        $inputs.innerHTML = '';
        for (let i = 0; i < INPUT_COUNT; i++) {
          const active = !!(inputs & (1 << i));
          const { name, note } = inputLabels[i];
          const el = document.createElement('div');
          el.className = 'input-card' + (active ? ' active' : '');
          el.innerHTML = `
            <div class="name">${escapeHtml(name)}</div>
            ${note ? `<div class="note">${escapeHtml(note)}</div>` : ''}
            <div class="status">${active ? 'Active' : 'Inactive'}</div>
            <div class="input-indicator"></div>
          `;
          $inputs.appendChild(el);
        }
      }

      async function toggleValve(n, on) {
        pending.add(n);
        render();
        try {
          const res = await fetch(`/sw?n=${n}&on=${on ? 1 : 0}`);
          const json = await res.json();
          if (typeof json.relays === 'number') relays = json.relays;
        } catch (_e) {
          /* keep last known state; next /poll will reconcile */
        }
        pending.delete(n);
        render();
      }

      async function closeAll() {
        try {
          const res = await fetch('/closeall');
          const json = await res.json();
          if (typeof json.relays === 'number') {
            relays = json.relays;
            render();
          }
        } catch (_e) { /* ignore; next /poll reconciles */ }
      }

      function appendLogLines(lines) {
        if (!lines || !lines.length) return;
        const atBottom = $terminal.scrollHeight - $terminal.scrollTop - $terminal.clientHeight < 30;
        for (const line of lines) {
          $terminal.appendChild(document.createTextNode(line + '\n'));
        }
        if (atBottom) $terminal.scrollTop = $terminal.scrollHeight;
      }

      async function poll() {
        if (paused) return;
        try {
          const res = await fetch(`/poll?since=${lastSeq}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();

          $conn.classList.add('live');

          if (json.seq !== undefined) lastSeq = json.seq;
          if (typeof json.relays === 'number' && json.relays !== relays) {
            relays = json.relays;
            render();
          }
          if (typeof json.inputs === 'number' && json.inputs !== inputs) {
            inputs = json.inputs;
            renderInputs();
          }
          if (json.distance_cm !== undefined) {
            $level.textContent = formatLevel(json.distance_cm);
          }
          if (json.uptime_ms !== undefined) {
            $uptime.textContent = formatUptime(json.uptime_ms);
          }
          if (typeof json.version === 'string' && $version.textContent !== json.version) {
            $version.textContent = json.version;
          }
          appendLogLines(json.lines);
        } catch (_e) {
          $conn.classList.remove('live');
        }
      }

      function renderChart(svg, $range, $window, ring, transform, unit) {
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        if (!ring || !Array.isArray(ring.buckets)) return;
        $window.textContent = describeWindow(ring.period_sec, ring.buckets.length);

        // Project a bucket to the display unit; min/max may swap if transform
        // is inverse-monotonic (cm → fullness %).
        const project = b => {
          const a = transform(b.avg);
          const lo1 = transform(b.min), lo2 = transform(b.max);
          return { avg: a, lo: Math.min(lo1, lo2), hi: Math.max(lo1, lo2), n: b.n, t: b.t,
                   rawMin: b.min, rawMax: b.max, rawAvg: b.avg };
        };

        const filled = ring.buckets.filter(b => b && b.n > 0).map(project);
        if (filled.length === 0) {
          const t = document.createElementNS(SVG_NS, 'text');
          t.setAttribute('x', '50%');
          t.setAttribute('y', '50%');
          t.setAttribute('text-anchor', 'middle');
          t.setAttribute('dominant-baseline', 'middle');
          t.setAttribute('class', 'chart-empty');
          t.textContent = 'No data yet';
          svg.appendChild(t);
          $range.textContent = '—';
          return;
        }

        let yMin = Infinity, yMax = -Infinity;
        for (const b of filled) {
          if (b.lo < yMin) yMin = b.lo;
          if (b.hi > yMax) yMax = b.hi;
        }
        $range.textContent = `${yMin.toFixed(1)} – ${yMax.toFixed(1)} ${unit}`;
        const yPad = Math.max((yMax - yMin) * 0.08, 0.2);
        yMin -= yPad; yMax += yPad;
        const yScale = yMax - yMin || 1;

        const vbW = 240, vbH = 80;
        const padX = 3, padY = 4;
        const w = vbW - padX * 2;
        const h = vbH - padY * 2;
        const cellW = w / ring.buckets.length;
        const yPos = v => padY + h * (1 - (v - yMin) / yScale);
        const periodSec = ring.period_sec;

        // First pass — min/max range bars.
        for (let i = 0; i < ring.buckets.length; i++) {
          const raw = ring.buckets[i];
          if (!raw || raw.n === 0) continue;
          const b = project(raw);
          const x = padX + i * cellW + cellW / 2;
          const line = document.createElementNS(SVG_NS, 'line');
          line.setAttribute('x1', x.toFixed(2));
          line.setAttribute('x2', x.toFixed(2));
          line.setAttribute('y1', yPos(b.hi).toFixed(2));
          line.setAttribute('y2', yPos(b.lo).toFixed(2));
          line.setAttribute('class', 'chart-range');
          svg.appendChild(line);
        }

        // Second pass — avg polyline.
        const pts = [];
        for (let i = 0; i < ring.buckets.length; i++) {
          const raw = ring.buckets[i];
          if (!raw || raw.n === 0) continue;
          const b = project(raw);
          const x = padX + i * cellW + cellW / 2;
          pts.push(`${x.toFixed(2)},${yPos(b.avg).toFixed(2)}`);
        }
        if (pts.length > 1) {
          const poly = document.createElementNS(SVG_NS, 'polyline');
          poly.setAttribute('points', pts.join(' '));
          poly.setAttribute('class', 'chart-line');
          svg.appendChild(poly);
        }

        // Third pass — avg dots with tooltips.
        for (let i = 0; i < ring.buckets.length; i++) {
          const raw = ring.buckets[i];
          if (!raw || raw.n === 0) continue;
          const b = project(raw);
          const x = padX + i * cellW + cellW / 2;
          const c = document.createElementNS(SVG_NS, 'circle');
          c.setAttribute('cx', x.toFixed(2));
          c.setAttribute('cy', yPos(b.avg).toFixed(2));
          c.setAttribute('r', '0.8');
          c.setAttribute('class', 'chart-dot');

          const date = new Date(b.t * 1000);
          const label = periodSec >= 86400
            ? date.toLocaleDateString()
            : date.toLocaleString([], { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
          const title = document.createElementNS(SVG_NS, 'title');
          title.textContent =
            `${label}: avg ${b.avg.toFixed(1)} ${unit}` +
            ` (min ${b.lo.toFixed(1)} / max ${b.hi.toFixed(1)} / n=${b.n})`;
          c.appendChild(title);
          svg.appendChild(c);
        }
      }

      async function pollHistory() {
        try {
          const res = await fetch('/history.json');
          if (!res.ok) return;
          const data = await res.json();
          const dist = data?.distance;
          if (!dist) return;
          const transform = tankCal ? distanceToFullness : v => v;
          const unit      = tankCal ? '%' : 'cm';
          renderChart($chart24h, $range24h, $window24h, dist.short, transform, unit);
          renderChart($chart30d, $range30d, $window30d, dist.long,  transform, unit);
        } catch (_e) { /* keep last render */ }
      }

      document.getElementById('clearLog').addEventListener('click', () => {
        $terminal.textContent = '';
      });
      document.getElementById('closeAll').addEventListener('click', closeAll);

      async function clearHistoryRing(ring, humanLabel) {
        if (!window.confirm(`Clear the ${humanLabel} of history data?`)) return;
        if (!window.confirm(`This permanently erases ${humanLabel} of stored measurements from device flash. Continue?`)) return;
        try {
          const res = await fetch(`/history/clear?ring=${encodeURIComponent(ring)}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          await pollHistory();
        } catch (e) {
          alert(`Clear failed: ${e.message || e}`);
        }
      }
      document.getElementById('clearShort').addEventListener(
        'click', () => clearHistoryRing('short', 'last 24 hours'));
      document.getElementById('clearLong').addEventListener(
        'click', () => clearHistoryRing('long', 'last 30 days'));
      document.addEventListener('visibilitychange', () => {
        paused = document.hidden;
      });

      (async () => {
        await loadConfig();
        render();
        renderInputs();
        poll();
        pollHistory();
        setInterval(poll, POLL_INTERVAL_MS);
        setInterval(pollHistory, HISTORY_POLL_MS);
      })();
    })();
  </script>
</body>
</html>
