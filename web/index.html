<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retention Tank</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a1f26;
      --panel2: #222831;
      --border: #2a3441;
      --text: #e6e9ee;
      --muted: #8a96a8;
      --accent: #3b82f6;
      --ok: #10b981;
      --off: #475569;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9;
        --panel: #fff;
        --panel2: #f1f3f6;
        --border: #e4e7eb;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --ok: #16a34a;
        --off: #94a3b8;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }
    header.top h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .version {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace;
    }

    .metrics {
      display: flex;
      gap: 18px;
      font-size: 13px;
    }
    .metric {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .metric label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .metric strong {
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 900px) {
      main { grid-template-columns: 1fr 1fr; }
    }

    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    section > h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    /* Foldable sections — clicking the title row (h2 or .term-head) toggles
       data-collapsed on the section. Caret indicator on h2 flips ▼/▶. */
    section[data-section] { grid-column: 1 / -1; }
    section[data-section] > :first-child { cursor: pointer; user-select: none; }
    section[data-section] h2::after {
      content: ' ▼';
      font-size: 10px;
      color: var(--muted);
      margin-left: .4em;
    }
    section[data-collapsed="true"] h2::after { content: ' ▶'; }
    section[data-collapsed="true"] { padding-bottom: 16px; }
    section[data-collapsed="true"] > :first-child { margin-bottom: 0; }
    section[data-collapsed="true"] .term-head { margin-bottom: 0; }
    section[data-collapsed="true"] > *:nth-child(n+2) { display: none; }

    .valve-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .valve {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: border-color .15s, background .15s, opacity .15s;
    }
    .valve:hover { border-color: var(--accent); }
    .valve.open {
      background: color-mix(in srgb, var(--ok) 18%, var(--panel2));
      border-color: var(--ok);
    }
    .valve .name {
      font-weight: 600;
      font-size: 13px;
    }
    .valve .note {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }
    .valve .status {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .valve.open .status { color: var(--ok); }
    .valve .toggle {
      align-self: flex-end;
      width: 36px;
      height: 20px;
      background: var(--off);
      border-radius: 11px;
      position: relative;
      flex-shrink: 0;
      transition: background .15s;
    }
    .valve .toggle::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform .15s;
    }
    .valve.open .toggle { background: var(--ok); }
    .valve.open .toggle::after { transform: translateX(16px); }
    .valve.pending {
      opacity: .55;
      pointer-events: none;
    }

    .term-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .term-head h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .term-head button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .term-head button:hover {
      color: var(--text);
      border-color: var(--accent);
    }
    .term-head button.danger:hover {
      color: #fff;
      border-color: #ef4444;
      background: #ef4444;
    }

    #terminal {
      margin: 0;
      background: #000;
      color: #cfe;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      height: 340px;
      overflow-y: auto;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #terminal:empty::before {
      content: "(no log lines yet)";
      color: #556;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--off);
      margin-left: 6px;
      vertical-align: middle;
      transition: background .2s;
    }
    .dot.live {
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
    }

    section.history { grid-column: 1 / -1; }
    .history-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 700px) {
      .history-grid { grid-template-columns: 1fr 1fr; }
    }
    .chart-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .chart-title .range {
      font-variant-numeric: tabular-nums;
      text-transform: none;
      letter-spacing: 0;
    }
    .chart-title button {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      font: 11px/1.4 system-ui, sans-serif;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
    }
    .chart-title button:hover { background: var(--panel); }
    .chart-title button.danger { color: #fff; background: #b91c1c; border-color: #991b1b; }
    .chart-title button.danger:hover { background: #991b1b; }
    .chart {
      display: block;
      width: 100%;
      aspect-ratio: 320 / 110;
      height: auto;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 4px;
      touch-action: pan-y;
    }
    .chart-range    { stroke: var(--muted); stroke-width: 0.6; opacity: 0.45; }
    .chart-line     { fill: none; stroke: var(--accent); stroke-width: 1; }
    .chart-dot      { fill: var(--accent); }
    .chart-empty    { fill: var(--muted); font-size: 6px; }
    .chart-axis line          { stroke: var(--muted); stroke-width: 0.3; opacity: 0.55; }
    .chart-axis text          { fill: var(--muted); font-size: 5.5px; font-variant-numeric: tabular-nums; }
    .chart-axis .axis-grid    { stroke-dasharray: 1 1.5; opacity: 0.25; }
    .chart-hit                { fill: transparent; cursor: crosshair; }
    .chart-crosshair          { stroke: var(--accent); stroke-width: 0.4; opacity: 0.6; }
    .chart-readout-bg         { fill: var(--panel); stroke: var(--border); stroke-width: 0.3; opacity: 0.96; }
    .chart-readout text       { fill: var(--text); font-size: 5px; font-variant-numeric: tabular-nums; }
    .chart-readout .ro-title  { font-weight: 600; }
    .chart-readout-pin .chart-readout-bg { stroke: var(--accent); stroke-width: 0.6; opacity: 1; }
    .chart-readout-pin .ro-close { fill: var(--accent); cursor: pointer; pointer-events: auto; font-weight: 700; }
    .chart-hilite-dot         { fill: var(--accent); stroke: var(--panel); stroke-width: 0.4; }
    @media (max-width: 640px) {
      .chart-axis-secondary   { display: none; }
    }

    section.inputs { grid-column: 1 / -1; }
    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .input-card {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-card.active {
      background: color-mix(in srgb, var(--ok) 18%, var(--panel2));
      border-color: var(--ok);
    }
    .input-card .name  { font-weight: 600; font-size: 13px; }
    .input-card .note  { font-size: 11px; color: var(--muted); line-height: 1.3; }
    .input-card .status {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .input-card.active .status { color: var(--ok); }
    .input-indicator {
      align-self: flex-end;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--off);
      transition: background .2s, box-shadow .2s;
    }
    .input-card.active .input-indicator {
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
    }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1><span id="title">Retention Tank</span><span id="conn" class="dot" title="connection"></span></h1>
      <small id="version" class="version">&mdash;</small>
    </div>
    <div class="metrics">
      <div class="metric">
        <label id="level-label">Tank distance</label>
        <strong id="level">&mdash;</strong>
      </div>
      <div class="metric">
        <label>Distance</label>
        <strong id="distance-raw">&mdash;</strong>
      </div>
      <div class="metric">
        <label>Water total</label>
        <strong id="water-total">&mdash;</strong>
      </div>
      <div class="metric">
        <label>Water (24h)</label>
        <strong id="water-24h">&mdash;</strong>
      </div>
      <div class="metric">
        <label>Uptime</label>
        <strong id="uptime">&mdash;</strong>
      </div>
    </div>
  </header>

  <main>
    <section class="history" data-section="distance">
      <h2>Tank Distance</h2>
      <div class="history-grid">
        <div>
          <div class="chart-title">
            <span id="window-24h">Last 24 hours</span>
            <span class="range" id="range-24h">&mdash;</span>
            <button id="clearShort" class="danger" type="button">Clear 24h</button>
          </div>
          <svg id="chart-24h" class="chart" viewBox="0 0 320 110"></svg>
        </div>
        <div>
          <div class="chart-title">
            <span id="window-30d">Last 30 days</span>
            <span class="range" id="range-30d">&mdash;</span>
            <button id="clearLong" class="danger" type="button">Clear 30d</button>
          </div>
          <svg id="chart-30d" class="chart" viewBox="0 0 320 110"></svg>
        </div>
      </div>
    </section>

    <section class="history" data-section="water">
      <h2>Water Consumption</h2>
      <div class="history-grid">
        <div>
          <div class="chart-title">
            <span id="water-window-24h">Last 24 hours</span>
            <span class="range" id="water-range-24h">&mdash;</span>
            <button id="clearWaterShort" class="danger" type="button">Clear 24h</button>
          </div>
          <svg id="water-chart-24h" class="chart" viewBox="0 0 320 110"></svg>
        </div>
        <div>
          <div class="chart-title">
            <span id="water-window-30d">Last 30 days</span>
            <span class="range" id="water-range-30d">&mdash;</span>
            <button id="clearWaterLong" class="danger" type="button">Clear 30d</button>
          </div>
          <svg id="water-chart-30d" class="chart" viewBox="0 0 320 110"></svg>
        </div>
      </div>
    </section>

    <section data-section="valves">
      <div class="term-head">
        <h2>Solenoid Valves</h2>
        <button id="closeAll" class="danger">Close all</button>
      </div>
      <div id="valves" class="valve-grid"></div>
    </section>

    <section class="inputs" data-section="inputs">
      <h2>Digital Inputs</h2>
      <div id="inputs" class="input-grid"></div>
    </section>

    <section data-section="log">
      <div class="term-head">
        <h2>Device Log</h2>
        <button id="clearLog">Clear</button>
      </div>
      <pre id="terminal"></pre>
    </section>
  </main>

  <script>
    (() => {
      const VALVE_COUNT = 8;
      const INPUT_COUNT = 8;
      const POLL_INTERVAL_MS = 750;
      const HISTORY_POLL_MS = 30000;
      const SVG_NS = 'http://www.w3.org/2000/svg';

      let lastSeq = 0;
      let relays = 0;
      let inputs = 0;
      let paused = false;
      const pending = new Set();
      let valveLabels = Array.from({ length: VALVE_COUNT }, (_, i) => ({
        name: `Valve ${i + 1}`, note: '',
      }));
      let inputLabels = Array.from({ length: INPUT_COUNT }, (_, i) => ({
        name: `Input ${i + 1}`, note: '',
      }));
      let tankCal = null;  // { empty_cm, full_cm } after loadConfig if set

      const $valves = document.getElementById('valves');
      const $terminal = document.getElementById('terminal');
      const $level = document.getElementById('level');
      const $levelLabel = document.getElementById('level-label');
      const $distanceRaw = document.getElementById('distance-raw');
      const $uptime = document.getElementById('uptime');
      const $conn = document.getElementById('conn');
      const $version = document.getElementById('version');
      const $title = document.getElementById('title');
      const $inputs   = document.getElementById('inputs');
      const $chart24h = document.getElementById('chart-24h');
      const $chart30d = document.getElementById('chart-30d');
      const $range24h = document.getElementById('range-24h');
      const $range30d = document.getElementById('range-30d');
      const $window24h = document.getElementById('window-24h');
      const $window30d = document.getElementById('window-30d');
      const $waterTotal = document.getElementById('water-total');
      const $water24h = document.getElementById('water-24h');
      const $waterChart24h = document.getElementById('water-chart-24h');
      const $waterChart30d = document.getElementById('water-chart-30d');
      const $waterRange24h = document.getElementById('water-range-24h');
      const $waterRange30d = document.getElementById('water-range-30d');
      const $waterWindow24h = document.getElementById('water-window-24h');
      const $waterWindow30d = document.getElementById('water-window-30d');

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      async function loadConfig() {
        try {
          const res = await fetch('/config.json');
          if (!res.ok) return;
          const cfg = await res.json();
          if (typeof cfg.title === 'string' && cfg.title) {
            document.title = cfg.title;
            $title.textContent = cfg.title;
          }
          if (Array.isArray(cfg.valves)) {
            for (let i = 0; i < VALVE_COUNT; i++) {
              const v = cfg.valves[i];
              if (!v) continue;
              if (typeof v.name === 'string' && v.name) valveLabels[i].name = v.name;
              if (typeof v.note === 'string')          valveLabels[i].note = v.note;
            }
          }
          if (Array.isArray(cfg.inputs)) {
            for (let i = 0; i < INPUT_COUNT; i++) {
              const v = cfg.inputs[i];
              if (!v) continue;
              if (typeof v.name === 'string' && v.name) inputLabels[i].name = v.name;
              if (typeof v.note === 'string')           inputLabels[i].note = v.note;
            }
          }
          if (cfg.tank && Number.isFinite(cfg.tank.empty_distance_cm)
                       && Number.isFinite(cfg.tank.full_distance_cm)
                       && cfg.tank.empty_distance_cm > cfg.tank.full_distance_cm) {
            tankCal = { empty_cm: cfg.tank.empty_distance_cm, full_cm: cfg.tank.full_distance_cm };
            $levelLabel.textContent = 'Tank level';
          }
        } catch (_e) { /* fall back to defaults */ }
      }

      function distanceToFullness(cm) {
        if (!tankCal) return null;
        const range = tankCal.empty_cm - tankCal.full_cm;
        const pct = (tankCal.empty_cm - cm) / range * 100;
        return Math.max(0, Math.min(100, pct));
      }

      function fullnessToDistance(pct) {
        if (!tankCal) return null;
        const range = tankCal.empty_cm - tankCal.full_cm;
        return tankCal.empty_cm - (pct / 100) * range;
      }

      function formatLevel(cm) {
        if (!Number.isFinite(cm)) return '—';
        const pct = distanceToFullness(cm);
        return pct !== null ? `${pct.toFixed(0)} %` : `${cm.toFixed(1)} cm`;
      }

      function describeWindow(periodSec, count) {
        const total = periodSec * count;
        if (total >= 86400 * 1.5) return `Last ${Math.round(total / 86400)} days`;
        if (total >= 3600)        return `Last ${Math.round(total / 3600)} hours`;
        return `Last ${Math.round(total / 60)} min`;
      }

      function formatUptime(ms) {
        const totalSec = Math.floor(ms / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return (h ? `${h}h ` : '') + ((h || m) ? `${m}m ` : '') + `${s}s`;
      }

      function render() {
        $valves.innerHTML = '';
        for (let i = 0; i < VALVE_COUNT; i++) {
          const open = !!(relays & (1 << i));
          const { name, note } = valveLabels[i];
          const el = document.createElement('div');
          el.className = 'valve'
            + (open ? ' open' : '')
            + (pending.has(i + 1) ? ' pending' : '');
          el.dataset.n = i + 1;
          el.innerHTML = `
            <div class="name">${escapeHtml(name)}</div>
            ${note ? `<div class="note">${escapeHtml(note)}</div>` : ''}
            <div class="status">${open ? 'Open' : 'Closed'}</div>
            <div class="toggle"></div>
          `;
          el.addEventListener('click', () => toggleValve(i + 1, !open));
          $valves.appendChild(el);
        }
      }

      function renderInputs() {
        $inputs.innerHTML = '';
        for (let i = 0; i < INPUT_COUNT; i++) {
          const active = !!(inputs & (1 << i));
          const { name, note } = inputLabels[i];
          const el = document.createElement('div');
          el.className = 'input-card' + (active ? ' active' : '');
          el.innerHTML = `
            <div class="name">${escapeHtml(name)}</div>
            ${note ? `<div class="note">${escapeHtml(note)}</div>` : ''}
            <div class="status">${active ? 'Active' : 'Inactive'}</div>
            <div class="input-indicator"></div>
          `;
          $inputs.appendChild(el);
        }
      }

      async function toggleValve(n, on) {
        pending.add(n);
        render();
        try {
          const res = await fetch(`/sw?n=${n}&on=${on ? 1 : 0}`);
          const json = await res.json();
          if (typeof json.relays === 'number') relays = json.relays;
        } catch (_e) {
          /* keep last known state; next /poll will reconcile */
        }
        pending.delete(n);
        render();
      }

      async function closeAll() {
        try {
          const res = await fetch('/closeall');
          const json = await res.json();
          if (typeof json.relays === 'number') {
            relays = json.relays;
            render();
          }
        } catch (_e) { /* ignore; next /poll reconciles */ }
      }

      function appendLogLines(lines) {
        if (!lines || !lines.length) return;
        const atBottom = $terminal.scrollHeight - $terminal.scrollTop - $terminal.clientHeight < 30;
        for (const line of lines) {
          $terminal.appendChild(document.createTextNode(line + '\n'));
        }
        if (atBottom) $terminal.scrollTop = $terminal.scrollHeight;
      }

      async function poll() {
        if (paused) return;
        try {
          const res = await fetch(`/poll?since=${lastSeq}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();

          $conn.classList.add('live');

          if (json.seq !== undefined) lastSeq = json.seq;
          if (typeof json.relays === 'number' && json.relays !== relays) {
            relays = json.relays;
            render();
          }
          if (typeof json.inputs === 'number' && json.inputs !== inputs) {
            inputs = json.inputs;
            renderInputs();
          }
          if (json.distance_cm !== undefined) {
            $level.textContent = formatLevel(json.distance_cm);
            $distanceRaw.textContent = Number.isFinite(json.distance_cm)
              ? `${json.distance_cm.toFixed(1)} cm` : '—';
          }
          if (typeof json.water_pulses === 'number') {
            $waterTotal.textContent = `${json.water_pulses} L`;
          }
          if (json.uptime_ms !== undefined) {
            $uptime.textContent = formatUptime(json.uptime_ms);
          }
          if (typeof json.version === 'string' && $version.textContent !== json.version) {
            $version.textContent = json.version;
          }
          appendLogLines(json.lines);
        } catch (_e) {
          $conn.classList.remove('live');
        }
      }

      // Pin state per chart, keyed by SVG element. Stored as bucket timestamp
      // so it survives re-renders (the ring rolls every poll, so an index would
      // drift).
      const chartPins = new WeakMap();

      function niceTicks(min, max, target) {
        const range = max - min;
        if (!Number.isFinite(range) || range <= 0) return { ticks: [min], step: 1 };
        const rough = range / target;
        const mag = Math.pow(10, Math.floor(Math.log10(rough)));
        const norm = rough / mag;
        let step;
        if (norm < 1.5)      step = 1 * mag;
        else if (norm < 3)   step = 2 * mag;
        else if (norm < 7)   step = 5 * mag;
        else                 step = 10 * mag;
        const ticks = [];
        const first = Math.ceil(min / step - 1e-9) * step;
        for (let v = first; v <= max + 1e-9; v += step) ticks.push(v);
        return { ticks, step };
      }

      function fmtTick(v, step) {
        const decimals = step >= 10 ? 0 : step >= 1 ? 0 : step >= 0.1 ? 1 : 2;
        // Hide negative-zero artefacts from floating-point step accumulation.
        if (Math.abs(v) < step * 1e-6) v = 0;
        return v.toFixed(decimals);
      }

      function fmtMMDD(date) {
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${m}-${d}`;
      }

      function svgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
        return el;
      }

      function renderChart(svg, $range, $window, ring, transform, unit, opts) {
        opts = opts || {};
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        if (!ring || !Array.isArray(ring.buckets)) return;
        $window.textContent = describeWindow(ring.period_sec, ring.buckets.length);

        // Project a bucket to the display unit; min/max may swap if transform
        // is inverse-monotonic (cm → fullness %).
        const project = b => {
          const a = transform(b.avg);
          const lo1 = transform(b.min), lo2 = transform(b.max);
          return { avg: a, lo: Math.min(lo1, lo2), hi: Math.max(lo1, lo2),
                   n: b.n, t: b.t,
                   rawMin: b.min, rawMax: b.max, rawAvg: b.avg };
        };

        const filled = [];
        for (let i = 0; i < ring.buckets.length; i++) {
          const raw = ring.buckets[i];
          if (raw && raw.n > 0) filled.push({ idx: i, b: project(raw), raw });
        }
        if (filled.length === 0) {
          svg.appendChild(svgEl('text', {
            x: '50%', y: '50%', 'text-anchor': 'middle',
            'dominant-baseline': 'middle', class: 'chart-empty',
          })).textContent = 'No data yet';
          $range.textContent = '—';
          return;
        }

        let yMin = Infinity, yMax = -Infinity;
        for (const f of filled) {
          if (f.b.lo < yMin) yMin = f.b.lo;
          if (f.b.hi > yMax) yMax = f.b.hi;
        }
        $range.textContent = `${yMin.toFixed(1)} – ${yMax.toFixed(1)} ${unit}`;
        const yPad = Math.max((yMax - yMin) * 0.08, 0.2);
        yMin -= yPad; yMax += yPad;
        const yScale = yMax - yMin || 1;

        // Layout. Wider left margin holds Y labels; right margin only when a
        // secondary axis is requested (distance charts with calibration).
        const vbW = 320, vbH = 110;
        const useSecondary = !!opts.secondaryFromPrimary;
        const padLeft = 22, padRight = useSecondary ? 22 : 4;
        const padTop = 4,  padBottom = 14;
        const plotX0 = padLeft, plotY0 = padTop;
        const plotW = vbW - padLeft - padRight;
        const plotH = vbH - padTop - padBottom;
        const cellW = plotW / ring.buckets.length;
        const yPos  = v => plotY0 + plotH * (1 - (v - yMin) / yScale);
        const xPos  = idx => plotX0 + idx * cellW + cellW / 2;

        // --- Y axis (primary, left) -----------------------------------------
        const yTickInfo = niceTicks(yMin + yPad, yMax - yPad, 4);
        const yAxisG = svgEl('g', { class: 'chart-axis' });
        for (const v of yTickInfo.ticks) {
          if (v < yMin || v > yMax) continue;
          const y = yPos(v);
          yAxisG.appendChild(svgEl('line', {
            x1: plotX0, x2: plotX0 + plotW, y1: y.toFixed(2), y2: y.toFixed(2),
            class: 'axis-grid',
          }));
          const t = svgEl('text', {
            x: (plotX0 - 2).toFixed(2), y: y.toFixed(2),
            'text-anchor': 'end', 'dominant-baseline': 'middle',
          });
          t.textContent = fmtTick(v, yTickInfo.step);
          yAxisG.appendChild(t);
        }
        // Unit label at top-left.
        const unitLabel = svgEl('text', {
          x: (plotX0 - 2).toFixed(2), y: (plotY0 - 0.5).toFixed(2),
          'text-anchor': 'end', 'dominant-baseline': 'baseline',
        });
        unitLabel.textContent = unit;
        yAxisG.appendChild(unitLabel);
        svg.appendChild(yAxisG);

        // --- Y axis (secondary, right) --------------------------------------
        if (useSecondary) {
          const yAxisR = svgEl('g', { class: 'chart-axis chart-axis-secondary' });
          for (const v of yTickInfo.ticks) {
            if (v < yMin || v > yMax) continue;
            const sv = opts.secondaryFromPrimary(v);
            if (!Number.isFinite(sv)) continue;
            const y = yPos(v);
            const t = svgEl('text', {
              x: (plotX0 + plotW + 2).toFixed(2), y: y.toFixed(2),
              'text-anchor': 'start', 'dominant-baseline': 'middle',
            });
            t.textContent = sv.toFixed(0);
            yAxisR.appendChild(t);
          }
          const secLabel = svgEl('text', {
            x: (plotX0 + plotW + 2).toFixed(2), y: (plotY0 - 0.5).toFixed(2),
            'text-anchor': 'start', 'dominant-baseline': 'baseline',
          });
          secLabel.textContent = opts.secondaryUnit || '';
          yAxisR.appendChild(secLabel);
          svg.appendChild(yAxisR);
        }

        // --- X axis ---------------------------------------------------------
        // Anchor the time→x mapping using any non-empty bucket. Times in the
        // ring are local-wall-clock unix seconds; we step ticks in real time
        // and project them back to bucket index space.
        const xAxisG = svgEl('g', { class: 'chart-axis' });
        xAxisG.appendChild(svgEl('line', {
          x1: plotX0, x2: plotX0 + plotW,
          y1: (plotY0 + plotH).toFixed(2), y2: (plotY0 + plotH).toFixed(2),
        }));
        const anchor = filled[0];
        if (anchor) {
          // b.t from the server is the bucket left-edge (period-aligned floor
          // of epoch). xPos(idx) draws at the bucket center, so wall-clock t
          // (a left-edge) projects via (-0.5) into cell-index space.
          const tStart = anchor.b.t - anchor.idx * ring.period_sec;
          const tEnd   = tStart + ring.buckets.length * ring.period_sec;
          const timeToX = t => xPos((t - anchor.b.t) / ring.period_sec + anchor.idx - 0.5);
          const isDayLevel = ring.period_sec >= 86400;

          if (isDayLevel) {
            // ~5-day ticks aligned to local midnight.
            const d = new Date(tStart * 1000);
            d.setHours(0, 0, 0, 0);
            let cur = d.getTime();
            while (cur / 1000 < tStart) cur += 86400 * 1000;
            while (cur / 1000 <= tEnd) {
              const t = cur / 1000;
              const x = timeToX(t);
              if (x >= plotX0 - 0.5 && x <= plotX0 + plotW + 0.5) {
                xAxisG.appendChild(svgEl('line', {
                  x1: x.toFixed(2), x2: x.toFixed(2),
                  y1: (plotY0 + plotH).toFixed(2),
                  y2: (plotY0 + plotH + 2).toFixed(2),
                }));
                const tx = svgEl('text', {
                  x: x.toFixed(2), y: (plotY0 + plotH + 7).toFixed(2),
                  'text-anchor': 'middle',
                });
                tx.textContent = fmtMMDD(new Date(t * 1000));
                xAxisG.appendChild(tx);
              }
              cur += 5 * 86400 * 1000;
            }
          } else {
            // 4-hour ticks aligned to local wall-clock.
            const d = new Date(tStart * 1000);
            d.setMinutes(0, 0, 0);
            let cur = d.getTime();
            while (cur / 1000 < tStart) cur += 3600 * 1000;
            while (cur / 1000 <= tEnd) {
              const dd = new Date(cur);
              if (dd.getHours() % 4 === 0) {
                const t = cur / 1000;
                const x = timeToX(t);
                if (x >= plotX0 - 0.5 && x <= plotX0 + plotW + 0.5) {
                  xAxisG.appendChild(svgEl('line', {
                    x1: x.toFixed(2), x2: x.toFixed(2),
                    y1: (plotY0 + plotH).toFixed(2),
                    y2: (plotY0 + plotH + 2).toFixed(2),
                  }));
                  const tx = svgEl('text', {
                    x: x.toFixed(2), y: (plotY0 + plotH + 7).toFixed(2),
                    'text-anchor': 'middle',
                  });
                  tx.textContent = String(dd.getHours()).padStart(2, '0') + ':00';
                  xAxisG.appendChild(tx);
                }
              }
              cur += 3600 * 1000;
            }
          }
        }
        svg.appendChild(xAxisG);

        // --- Data layers: range bars, polyline, dots ------------------------
        const dataG = svgEl('g', {});
        for (const f of filled) {
          const x = xPos(f.idx);
          dataG.appendChild(svgEl('line', {
            x1: x.toFixed(2), x2: x.toFixed(2),
            y1: yPos(f.b.hi).toFixed(2), y2: yPos(f.b.lo).toFixed(2),
            class: 'chart-range',
          }));
        }
        if (filled.length > 1) {
          const pts = filled.map(f => `${xPos(f.idx).toFixed(2)},${yPos(f.b.avg).toFixed(2)}`);
          dataG.appendChild(svgEl('polyline', {
            points: pts.join(' '),
            class: 'chart-line',
          }));
        }
        for (const f of filled) {
          dataG.appendChild(svgEl('circle', {
            cx: xPos(f.idx).toFixed(2), cy: yPos(f.b.avg).toFixed(2),
            r: '0.9', class: 'chart-dot',
          }));
        }
        svg.appendChild(dataG);

        // --- Interaction overlay: hit area + crosshair + readout ------------
        const hit = svgEl('rect', {
          x: plotX0, y: plotY0, width: plotW, height: plotH, class: 'chart-hit',
        });
        svg.appendChild(hit);

        const overlay = svgEl('g', {});
        overlay.style.pointerEvents = 'none';
        svg.appendChild(overlay);

        const drawReadout = (f, pinned) => {
          while (overlay.firstChild) overlay.removeChild(overlay.firstChild);
          const x = xPos(f.idx);
          const yAvg = yPos(f.b.avg);

          // Crosshair vertical line.
          overlay.appendChild(svgEl('line', {
            x1: x.toFixed(2), x2: x.toFixed(2),
            y1: plotY0, y2: (plotY0 + plotH).toFixed(2),
            class: 'chart-crosshair',
          }));
          // Highlight dot.
          overlay.appendChild(svgEl('circle', {
            cx: x.toFixed(2), cy: yAvg.toFixed(2),
            r: '1.6', class: 'chart-hilite-dot',
          }));

          // Readout box.
          const date = new Date(f.b.t * 1000);
          const isDay = ring.period_sec >= 86400;
          const timeLabel = isDay
            ? date.toLocaleDateString()
            : date.toLocaleString([], { hour: '2-digit', minute: '2-digit',
                                        day: 'numeric', month: 'short' });
          const lineAvg = `avg ${f.b.avg.toFixed(1)} ${unit}`;
          const lineRng = `${f.b.lo.toFixed(1)} – ${f.b.hi.toFixed(1)} ${unit}`;
          const lineN   = `n = ${f.b.n}`;
          const lineSec = useSecondary
            ? `${opts.secondaryFromPrimary(f.b.avg).toFixed(0)} ${opts.secondaryUnit || ''}`.trim()
            : null;

          const lines = [timeLabel, lineAvg, lineRng, lineN];
          if (lineSec) lines.splice(2, 0, lineSec);

          const boxW = 56, lineH = 6;
          const boxH = lines.length * lineH + 4 + (pinned ? 0 : 0);
          // Flip left/right so the box stays inside the plot area.
          let boxX = x + 2;
          if (boxX + boxW > plotX0 + plotW) boxX = x - 2 - boxW;
          let boxY = plotY0 + 2;
          if (boxY + boxH > plotY0 + plotH - 2) boxY = plotY0 + plotH - 2 - boxH;

          const ro = svgEl('g', { class: 'chart-readout' + (pinned ? ' chart-readout-pin' : '') });
          ro.appendChild(svgEl('rect', {
            x: boxX.toFixed(2), y: boxY.toFixed(2),
            width: boxW, height: boxH, rx: 1.5, ry: 1.5,
            class: 'chart-readout-bg',
          }));
          for (let i = 0; i < lines.length; i++) {
            const t = svgEl('text', {
              x: (boxX + 2).toFixed(2),
              y: (boxY + 4 + i * lineH).toFixed(2),
              class: i === 0 ? 'ro-title' : '',
            });
            t.textContent = lines[i];
            ro.appendChild(t);
          }
          if (pinned) {
            const close = svgEl('text', {
              x: (boxX + boxW - 2).toFixed(2),
              y: (boxY + 4).toFixed(2),
              'text-anchor': 'end',
              class: 'ro-close',
            });
            close.textContent = '×';
            close.addEventListener('click', e => {
              e.stopPropagation();
              chartPins.delete(svg);
              while (overlay.firstChild) overlay.removeChild(overlay.firstChild);
            });
            ro.appendChild(close);
          }
          overlay.appendChild(ro);
        };

        const snapToBucket = clientX => {
          const rect = svg.getBoundingClientRect();
          if (rect.width === 0) return null;
          const xUser = (clientX - rect.left) / rect.width * vbW;
          if (xUser < plotX0 || xUser > plotX0 + plotW) return null;
          // Find filled bucket whose center is closest.
          let best = null, bestDx = Infinity;
          for (const f of filled) {
            const dx = Math.abs(xPos(f.idx) - xUser);
            if (dx < bestDx) { bestDx = dx; best = f; }
          }
          return best;
        };

        hit.addEventListener('pointermove', e => {
          if (chartPins.has(svg)) return;  // pinned readout has priority
          const f = snapToBucket(e.clientX);
          if (f) drawReadout(f, false);
        });
        hit.addEventListener('pointerleave', () => {
          if (chartPins.has(svg)) return;
          while (overlay.firstChild) overlay.removeChild(overlay.firstChild);
        });
        hit.addEventListener('click', e => {
          const f = snapToBucket(e.clientX);
          if (!f) return;
          // Toggle: clicking the same pinned bucket clears the pin.
          const existing = chartPins.get(svg);
          if (existing && existing.t === f.b.t) {
            chartPins.delete(svg);
            while (overlay.firstChild) overlay.removeChild(overlay.firstChild);
            return;
          }
          chartPins.set(svg, { t: f.b.t });
          drawReadout(f, true);
        });

        // Re-apply pin after re-render. Match by timestamp; if the pinned
        // bucket has rolled out of the ring, drop the pin.
        const pin = chartPins.get(svg);
        if (pin) {
          let match = null;
          for (const f of filled) {
            if (f.b.t === pin.t) { match = f; break; }
          }
          if (match) drawReadout(match, true);
          else chartPins.delete(svg);
        }
      }

      async function pollHistory() {
        try {
          const res = await fetch('/history.json');
          if (!res.ok) return;
          const data = await res.json();
          const dist = data?.distance;
          if (dist) {
            const transform = tankCal ? distanceToFullness : v => v;
            const unit      = tankCal ? '%' : 'cm';
            const distOpts  = tankCal
              ? { secondaryFromPrimary: fullnessToDistance, secondaryUnit: 'cm' }
              : undefined;
            renderChart($chart24h, $range24h, $window24h, dist.short, transform, unit, distOpts);
            renderChart($chart30d, $range30d, $window30d, dist.long,  transform, unit, distOpts);
          }
          const water = data?.water;
          if (water) {
            // Flow-rate sample is L/min, recorded once a minute from the pulse counter.
            renderChart($waterChart24h, $waterRange24h, $waterWindow24h, water.short, v => v, 'L/min');
            renderChart($waterChart30d, $waterRange30d, $waterWindow30d, water.long,  v => v, 'L/min');
            // Total liters in the last 24 h = sum over short-ring buckets of
            // (avg L/min × n samples). Each sample covers one minute, so that
            // product is the literal liter count contributed by that bucket.
            if (water.short && Array.isArray(water.short.buckets)) {
              let total = 0;
              for (const b of water.short.buckets) {
                if (b && b.n > 0 && Number.isFinite(b.avg)) total += b.avg * b.n;
              }
              $water24h.textContent = `${Math.round(total)} L`;
            }
          }
        } catch (_e) { /* keep last render */ }
      }

      document.getElementById('clearLog').addEventListener('click', () => {
        $terminal.textContent = '';
      });
      document.getElementById('closeAll').addEventListener('click', closeAll);

      async function clearHistoryRing(signal, ring, signalHuman, ringHuman) {
        if (!window.confirm(`Clear the ${ringHuman} of ${signalHuman} history?`)) return;
        if (!window.confirm(`This permanently erases ${ringHuman} of stored ${signalHuman} data from device flash. Continue?`)) return;
        try {
          const url = `/history/clear?signal=${encodeURIComponent(signal)}&ring=${encodeURIComponent(ring)}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          await pollHistory();
        } catch (e) {
          alert(`Clear failed: ${e.message || e}`);
        }
      }
      document.getElementById('clearShort').addEventListener(
        'click', () => clearHistoryRing('distance', 'short', 'tank distance', 'last 24 hours'));
      document.getElementById('clearLong').addEventListener(
        'click', () => clearHistoryRing('distance', 'long',  'tank distance', 'last 30 days'));
      document.getElementById('clearWaterShort').addEventListener(
        'click', () => clearHistoryRing('water', 'short', 'water consumption', 'last 24 hours'));
      document.getElementById('clearWaterLong').addEventListener(
        'click', () => clearHistoryRing('water', 'long',  'water consumption', 'last 30 days'));

      // Foldable sections. Click the title row to collapse/expand; state
      // persists in localStorage so a reload restores what the user had open.
      for (const sect of document.querySelectorAll('section[data-section]')) {
        const key = `fold-${sect.dataset.section}`;
        if (localStorage.getItem(key) === '1') sect.dataset.collapsed = 'true';
        const head = sect.firstElementChild;
        head.addEventListener('click', e => {
          if (e.target.closest('button')) return; // let action buttons act on their own
          const collapsed = sect.dataset.collapsed !== 'true';
          if (collapsed) sect.dataset.collapsed = 'true';
          else delete sect.dataset.collapsed;
          localStorage.setItem(key, collapsed ? '1' : '0');
        });
      }

      document.addEventListener('visibilitychange', () => {
        paused = document.hidden;
      });

      (async () => {
        await loadConfig();
        render();
        renderInputs();
        poll();
        pollHistory();
        setInterval(poll, POLL_INTERVAL_MS);
        setInterval(pollHistory, HISTORY_POLL_MS);
      })();
    })();
  </script>
</body>
</html>
